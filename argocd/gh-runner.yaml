---
# Self-hosted GitHub Actions runner for the Algovectra org.
#
# Plain Deployment (replicas=1), no operator/CRDs — deliberately NOT actions-
# runner-controller. Registered org-level against Algovectra with the label
# `gha-runner-scale-set-algovectra` so workflows that currently target the
# (buggy) ARC runner group route here unchanged via:
#   runs-on: [self-hosted, gha-runner-scale-set-algovectra]
#
# Security / isolation (by construction):
#   * No host docker.sock, no host paths, not privileged → the runner CANNOT
#     spawn nested containers. Container/docker-build jobs must stay on the
#     host DIND builder; this pod handles shell/lint/test/deploy CI only.
#   * Non-root (runAsUser 1001 = the image's `runner` user, runAsNonRoot, no
#     privilege escalation).
#   * readOnlyRootFilesystem; all state on the gh-runner PVC mounted at the
#     image's home (/home/runner) where run.sh and config.sh live and write.
#   * Dedicated ServiceAccount with ZERO RBAC (a runner needs none — it just
#     long-polls GitHub). This pod cannot touch the DIND builder, the host,
#     or other pods beyond normal network.
#
# Registration: see docs/gh-runner.md. One-time `config.sh --unattended` writes
# credentials to the PVC; the running container just execs run.sh. No secret is
# committed — the registration token is short-lived/single-use and fetched ad-hoc.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gh-runner
  namespace: runner
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gh-runner
  namespace: runner
  labels:
    app.kubernetes.io/name: gh-runner
    app.kubernetes.io/part-of: runner
spec:
  replicas: 1
  strategy:
    type: Recreate          # single replica + a RWX-less PVC; never roll two
  selector:
    matchLabels:
      app.kubernetes.io/name: gh-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gh-runner
        app.kubernetes.io/part-of: runner
    spec:
      serviceAccountName: gh-runner
      automountServiceAccountToken: false   # no API creds needed
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:latest
          imagePullPolicy: Always
          workingDir: /home/runner
          # Start the agent. Registration is done once into the PVC (see docs);
          # if not yet registered, run.sh exits and the runbook registers.
          # The init container seeds the PVC from the image's /home/runner, so
          # run.sh/config.sh exist on the volume and survive pod regens.
          command: ["./run.sh"]
          env:
            - name: RUNNER_ALLOW_RUNASROOT
              value: "0"          # assert non-root; image default, explicit for clarity
          securityContext:
            runAsUser: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: runner-home
              mountPath: /home/runner
            # readOnlyRootFilesystem makes /tmp read-only; the .NET runner
            # writes transient files there, so back it with an emptyDir.
            - name: tmp
              mountPath: /tmp
      # Seed the PVC from the image's /home/runner on first boot. The image
      # ships run.sh/config.sh/bin/externals there; mounting an empty PVC over
      # /home/runner would shadow them (the original "no such file" crash).
      # cp -rn copies recursively without clobbering existing files, so a
      # previously-registered .runner/.credentials is preserved across restarts
      # and re-registration is never needed. We avoid -a (preserve times/owner)
      # because utime on the local-path mount EPERMs for non-root.
      initContainers:
        - name: seed-home
          image: ghcr.io/actions/actions-runner:latest
          imagePullPolicy: IfNotPresent
          workingDir: /home/runner
          command: ["/bin/sh", "-c", "cp -rn /home/runner/. /mnt/runner-home/ 2>/dev/null; true"]
          securityContext:
            runAsUser: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runner-home
              mountPath: /mnt/runner-home
      volumes:
        - name: runner-home
          persistentVolumeClaim:
            claimName: gh-runner
        - name: tmp
          emptyDir: {}
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
