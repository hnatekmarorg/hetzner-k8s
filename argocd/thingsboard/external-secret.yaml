# Syncs the PostgreSQL credentials from OpenBao (clusters/thingsboard)
# to the thingsboard namespace as thingsboard-db-creds
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thingsboard-db
  namespace: thingsboard
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: local
    kind: ClusterSecretStore
  target:
    name: thingsboard-db-creds
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: thingsboard
        property: url
    - secretKey: username
      remoteRef:
        key: thingsboard
        property: username
    - secretKey: password
      remoteRef:
        key: thingsboard
        property: password
