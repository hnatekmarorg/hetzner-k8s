# Syncs Docker Hub credentials from OpenBao (algovectra/dockerhub) into the
# default namespace as the dockerhub dockerconfigjson image pull secret, for
# the pizza-admin and pizza-backend deployments. The Gitea→Docker Hub
# migration on the consumer side is not landed yet.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dockerhub
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: local-algovectra
    kind: ClusterSecretStore
  target:
    name: dockerhub
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "https://index.docker.io/v1/": {
                "username": "{{ .username }}",
                "password": "{{ .password }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: dockerhub
        property: username
    - secretKey: password
      remoteRef:
        key: dockerhub
        property: password
