---
# Job to label the OIDC secret
# Uses the shared oidc-secret-labeler ServiceAccount defined in label-oidc-secret.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: label-oidc-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: oidc-secret-labeler
      restartPolicy: Never
      containers:
        - name: label-secret
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Labeling OIDC secret for ArgoCD..."
              kubectl label secret argocd-bootstrap-hnatekmar-xyz -n argocd app.kubernetes.io/part-of=argocd --overwrite
              echo "Secret labeled successfully!"
  backoffLimit: 3
