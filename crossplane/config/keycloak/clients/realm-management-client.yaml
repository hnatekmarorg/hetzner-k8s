---
# The `realm-management` client, ADOPTED (never created) so the role grants can REFERENCE it.
#
# WHY THIS FILE EXISTS — the trap that made all four grants fail:
# a `ClientServiceAccountRole` puts the role-providing client's id into the URL
#   POST /admin/realms/{realm}/users/{service-account-id}/role-mappings/clients/{id}
# and Keycloak wants the client's INTERNAL UUID there, not its clientId. The provider's own generated
# schema says so — `clientId` carries
#   +crossplane:generate:reference:extractor=common.UUIDExtractor()
# — but the field is NAMED `clientId`, so writing the string `realm-management` is the obvious thing to do
# and it only fails at runtime:
#
#   create failed: ... POST .../role-mappings/clients/realm-management: 404 Not Found.
#   Response body: {"error":"Client not found"}
#
# (Measured 2026-09-20: all four grants — dev/prod × manage-clients/view-realm — sat Ready=False with
# exactly that message while every other field resolved correctly.)
#
# THE REMEDY is `clientIdRef`, which resolves to the referenced Client MR's UUID. That needs a Client MR
# for `realm-management` — which cannot be *created*, because Keycloak makes it at realm creation — so it
# is IMPORTED instead, through the Terraform-level `import` attribute the provider exposes for precisely
# this case: "clients that Keycloak creates automatically during realm creation, such as `account` and
# `admin-cli`".
#
# SAFETY, because this is the realm's admin client and a stray write here is a bad day:
#   * managementPolicies WITHOUT Update/Delete — Create performs the import (a read that records the id)
#     and after that this object is only ever observed. Crossplane cannot modify or remove it.
#   * deletionPolicy Orphan — deleting this MR leaves the client itself alone.
# The residual risk is stated rather than hidden: Terraform's import-then-apply can reassert schema
# defaults during that single Create step. If that ever becomes a concern, the zero-write variant is to
# drop `import` and pin the identity instead —
#   metadata.annotations: crossplane.io/external-name: master/<realm-management-uuid>
#   spec.managementPolicies: ["Observe"]
# — which never calls Create at all, at the cost of hardcoding an id that the admin console shows in the
# URL of that client.
apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
kind: Client
metadata:
  name: realm-management
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  deletionPolicy: Orphan
  managementPolicies: ["Create", "Observe"]
  providerConfigRef:
    name: sso-hnatekmar-xyz
  forProvider:
    realmId: master
    clientId: realm-management
    # REQUIRED BY A CEL RULE, not by the schema: the CRD declares
    #   !('*' in policy || 'Create' in policy || 'Update' in policy) || has(accessType)
    # so any MR that may Create or Update must state it — which this one must, to do the import. Omitting it
    # is rejected at admission: "spec: Invalid value: spec.forProvider.accessType is a required parameter".
    #
    # The VALUE was measured against the realm rather than taken from documentation, because the one-time
    # import-apply would otherwise be a write to the realm's admin client. With PUBLIC clients as controls —
    # `account` and `admin-cli` both answer a secretless client_credentials attempt with
    # "unauthorized_client: Public client not allowed to retrieve service account" — `realm-management`
    # answers "invalid_client: Invalid client or Invalid client credentials", which is the confidential path
    # (client authentication required). A bearer-only client does not answer that way, so CONFIDENTIAL is
    # the value that matches reality.
    accessType: CONFIDENTIAL
    import: true
