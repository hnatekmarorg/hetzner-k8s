---
# Keycloak OIDC client for the ON-PREM DEV cluster's Crossplane — the twin of
# crossplane-prod-client.yaml, which carries the full rationale (why a scoped identity instead of the
# realm admin, why one per cluster, what `manage-clients` and `view-realm` are for, and how the secret
# reaches the on-prem vault).
#
# Read that file before changing this one: the two are meant to differ ONLY in the cluster they name, so
# a divergence between them is the mistake to look for first.
#
# The one thing worth repeating here, because it is the part that surprises people: this identity can
# create a client, and it CANNOT grant that client's service account a realm role. That is not an
# oversight — a realm role like k8s-dev-admin is cluster access, and it is granted in the hub (see
# kubectl-agent-client.yaml). Keeping those two jobs in different identities is what stops an on-prem
# compromise from minting cluster access for itself.
apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
kind: Client
metadata:
  name: crossplane-dev-hnatekmar-xyz
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  deletionPolicy: Delete
  providerConfigRef:
    name: sso-hnatekmar-xyz
  writeConnectionSecretToRef:
    name: crossplane-dev-hnatekmar-xyz
    namespace: crossplane-system
  forProvider:
    accessType: CONFIDENTIAL
    realmId: master
    clientId: crossplane-dev-hnatekmar-xyz
    enabled: true
    standardFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
---
apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
kind: ClientServiceAccountRole
metadata:
  name: crossplane-dev-manage-clients
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  deletionPolicy: Delete
  providerConfigRef:
    name: sso-hnatekmar-xyz
  forProvider:
    realmId: master
    # The client that PROVIDES the role — by REFERENCE, never by name: this field carries the client's
    # INTERNAL UUID, so a bare name puts a string where a UUID belongs and Keycloak answers 404 "Client not
    # found". master-realm-client.yaml declares the referent (observed, never written) and the reference
    # resolves to its UUID.
    #
    # NOTE THE NAME. In the MASTER realm the admin client is `<realm>-realm`, i.e. `master-realm`;
    # `realm-management` exists only in non-master realms, and naming it here fails as an empty by-clientId
    # lookup ("openid client with name realm-management does not exist"). Both traps are documented in
    # docs/crossplane/keycloak.md.
    clientIdRef:
      name: master-realm
    role: manage-clients
    serviceAccountUserClientIdRef:
      name: crossplane-dev-hnatekmar-xyz
---
apiVersion: openidclient.keycloak.crossplane.io/v1alpha1
kind: ClientServiceAccountRole
metadata:
  name: crossplane-dev-view-realm
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  deletionPolicy: Delete
  providerConfigRef:
    name: sso-hnatekmar-xyz
  forProvider:
    realmId: master
    # The client that PROVIDES the role — by REFERENCE, never by name: this field carries the client's
    # INTERNAL UUID, so a bare name puts a string where a UUID belongs and Keycloak answers 404 "Client not
    # found". master-realm-client.yaml declares the referent (observed, never written) and the reference
    # resolves to its UUID.
    #
    # NOTE THE NAME. In the MASTER realm the admin client is `<realm>-realm`, i.e. `master-realm`;
    # `realm-management` exists only in non-master realms, and naming it here fails as an empty by-clientId
    # lookup ("openid client with name realm-management does not exist"). Both traps are documented in
    # docs/crossplane/keycloak.md.
    clientIdRef:
      name: master-realm
    role: view-realm
    serviceAccountUserClientIdRef:
      name: crossplane-dev-hnatekmar-xyz
