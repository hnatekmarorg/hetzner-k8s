---
# Map hnatekmarorg-admin group to its realm roles
# Users in this group will automatically get the hnatekmarorg-admin and k8s-infra-admin realm roles
#
# WHY BOTH ARE IN ONE RESOURCE. `exhaustive: true` declares the group's realm-role list COMPLETE:
# the provider removes anything not named here. A second Roles resource for the same group would
# also claim completeness, so the two would keep deleting each other's grant. One resource owns the
# list; a new grant is a line added below.
#
# k8s-infra-admin is the cluster-admin tier on the `infra` class of Kubernetes clusters (this
# Hetzner cluster among them) and is bound by rbac/cluster-access.yaml. It is granted to the same
# group that already holds ArgoCD and Keycloak admin: cluster-admin is not a smaller privilege than
# either, so splitting them would only make the access path harder to reason about.
apiVersion: group.keycloak.crossplane.io/v1alpha1
kind: Roles
metadata:
  name: hnatekmarorg-admin-realm-roles
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  deletionPolicy: Delete
  providerConfigRef:
    name: sso-hnatekmar-xyz
  forProvider:
    groupIdRef:
      name: hnatekmarorg-admin
    realmId: master
    roleIdsRefs:
      - name: hnatekmarorg-admin-realm-role
      - name: k8s-infra-admin
    exhaustive: true
