apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  name: hnatekmarorg-ssh-class-dev
  namespace: crossplane-system
spec:
  deletionPolicy: Delete
  providerConfigRef:
    name: bao-hnatekmar-xyz
  forProvider:
    name: hnatekmarorg-ssh-class-dev
    policy: |
      # Mint dev-class admin certificates (sandboxes, free to break).
      path "hnatekmarorg-ssh-dev/sign/admin" {
        capabilities = ["create", "update"]
      }
      # Read the class trust anchor so a host can install /etc/ssh/ssh_ca_dev.pub.
      path "hnatekmarorg-ssh-dev/config/ca" {
        capabilities = ["read"]
      }
      path "hnatekmarorg-ssh-dev/roles/*" {
        capabilities = ["read", "list"]
      }
