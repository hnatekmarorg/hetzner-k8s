apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  name: hnatekmarorg-ssh-class-infra
  namespace: crossplane-system
spec:
  deletionPolicy: Delete
  providerConfigRef:
    name: bao-hnatekmar-xyz
  forProvider:
    name: hnatekmarorg-ssh-class-infra
    policy: |
      # Mint infra-class admin certificates (machines that must keep working).
      path "hnatekmarorg-ssh-infra/sign/admin" {
        capabilities = ["create", "update"]
      }
      # Read the class trust anchor so a host can install /etc/ssh/ssh_ca_infra.pub.
      # Reads the public key only; the private key needs sudo on the same path.
      path "hnatekmarorg-ssh-infra/config/ca" {
        capabilities = ["read"]
      }
      path "hnatekmarorg-ssh-infra/roles/*" {
        capabilities = ["read", "list"]
      }
