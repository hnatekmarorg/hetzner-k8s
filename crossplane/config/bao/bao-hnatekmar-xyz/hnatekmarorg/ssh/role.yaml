apiVersion: ssh.vault.upbound.io/v1alpha1
kind: SecretBackendRole
metadata:
  name: hnatekmarorg-ssh-ca-role
  namespace: crossplane-system
spec:
  deletionPolicy: Delete
  forProvider:
    name: "hnatekmarorg"
    backend: hnatekmarorg-ssh
    keyType: "ca"
    defaultUser: "root"
    # cidrList is not applicable to CA-type roles. The API drops it, and
    # provider v2.2.2 then retries the update forever. The estate nets belong
    # in defaultCriticalOptions.source-address when this role needs a pin.
    allowedUsers: "*"
    # Keep TTLs in seconds. The API returns seconds and provider v2.2.2 does
    # not normalize duration strings, so "24h" causes a permanent diff.
    ttl: "86400"
    maxTtl: "604800"
    allowUserCertificates: true
    allowedExtensions: "permit-pty"
    defaultExtensions:
      "permit-pty": ""
      "permit-port-forwarding": ""
  providerConfigRef:
    name: bao-hnatekmar-xyz
