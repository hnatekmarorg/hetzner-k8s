---
# Syncs the Grafana Keycloak client secret (created by Crossplane as a
# connection secret in the crossplane-system namespace) into the monitoring
# namespace so the Grafana deployment can use it for SSO.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oauth
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-crossplane
    kind: ClusterSecretStore
  target:
    name: grafana-hnatekmar-xyz
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: grafana-hnatekmar-xyz
        property: attribute.client_secret
