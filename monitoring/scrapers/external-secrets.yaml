---
# Scrape External Secrets Operator controller metrics (pod port 8080, enabled by default)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: external-secrets
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  namespaceSelector:
    matchNames:
      - external-secrets
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      path: /metrics
