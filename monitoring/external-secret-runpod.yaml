---
# Syncs the RunPod API key from OpenBao (algovectra/runpod) into the
# monitoring namespace for the runpod-exporter. Same store/pattern as the
# digitalocean external secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: runpod
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: local-algovectra
    kind: ClusterSecretStore
  target:
    name: runpod
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api_key
      remoteRef:
        key: /algovectra/runpod
        property: api_key
