---
# Public push endpoints for external collectors (RunPod GPU instances).
# Both are gated by Kong key-auth; the token is stored in Vault and synced
# by external-secrets into the monitoring-pusher-key-auth Secret.
#
#   apikey: <token>      -> POST https://loki.hnatekmar.xyz/loki/api/v1/push
#   apikey: <token>      -> https://prometheus-push.hnatekmar.xyz/api/v1/write
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loki-push
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    konghq.com/plugins: key-auth
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - loki.hnatekmar.xyz
      secretName: loki-push-tls
  rules:
    - host: loki.hnatekmar.xyz
      http:
        paths:
          - path: /loki/api/v1/push
            pathType: Prefix
            backend:
              service:
                name: loki
                port:
                  number: 3100
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-push
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    konghq.com/plugins: key-auth
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - prometheus-push.hnatekmar.xyz
      secretName: prometheus-push-tls
  rules:
    - host: prometheus-push.hnatekmar.xyz
      http:
        paths:
          - path: /api/v1/write
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-prometheus
                port:
                  number: 9090
